<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#060A0E">
<title>Seja Livre · Indicações</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#060A0E; --ink-2:#0B1218; --line:rgba(255,255,255,.09);
  --text:#EAF2F0; --muted:#8FA3A0; --live:#2BE6BA; --live-2:#0FA77E; --deep:#063D30;
  --err:#FF6B6B; --glass:rgba(255,255,255,.035); --dim:#55625F;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{background:var(--ink);color:var(--text);font-family:Sora,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100dvh;overflow-x:hidden;position:relative}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(70% 45% at 85% -5%, rgba(43,230,186,.18), transparent 60%),
             radial-gradient(60% 40% at -10% 105%, rgba(15,167,126,.14), transparent 60%);}
.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 16px 48px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px}
.word{display:flex;flex-direction:column;line-height:1}
.word b{font-weight:700;font-size:15px;letter-spacing:.22em}
.word span{font-weight:300;font-size:10px;letter-spacing:.32em;color:var(--muted);margin-top:5px;text-transform:uppercase}
.tag{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--live);border:1px solid rgba(43,230,186,.3);border-radius:999px;padding:7px 12px;background:rgba(43,230,186,.06);white-space:nowrap}
.kicker{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--live);margin-bottom:10px}
h1{font-weight:200;font-size:clamp(30px,7vw,46px);line-height:1.05;letter-spacing:-.04em;margin-bottom:10px}
h1 em{font-style:normal;font-weight:600;color:var(--live)}
.lead{color:var(--muted);font-size:14px;line-height:1.6;font-weight:300;max-width:52ch}

/* login */
#login{max-width:420px;margin:8vh auto 0}
.card{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
label.l{display:block;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
input.in{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);outline:0;color:var(--text);font:400 17px Sora,system-ui,sans-serif;padding:8px 0;letter-spacing:.08em}
input.in:focus{border-color:var(--live)}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:14px;padding:15px 18px;min-height:50px;font:600 15px Sora,system-ui,sans-serif;cursor:pointer;color:#03140F;background:linear-gradient(100deg,#7CF5D6,var(--live) 45%,var(--live-2))}
.btn.full{width:100%;margin-top:18px}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:400;min-height:40px;padding:9px 14px;font-size:13px}
.btn:focus-visible,.chip:focus-visible,input:focus-visible{outline:2px solid var(--live);outline-offset:3px}
.btn[disabled]{opacity:.4;cursor:wait}
.erro{color:var(--err);font-size:13px;margin-top:12px;min-height:18px}

/* painel */
#painel{display:none}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.meta{font-size:11px;color:var(--dim);letter-spacing:.06em;margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:26px}
.k{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;text-align:left;color:var(--text);font-family:inherit;transition:border-color .2s,background .2s}
.k[aria-pressed="true"]{border-color:rgba(43,230,186,.55);background:linear-gradient(140deg,rgba(43,230,186,.12),rgba(15,167,126,.03))}
.k .n{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.k .big{font-size:34px;font-weight:200;letter-spacing:-.03em;margin:8px 0 2px;font-variant-numeric:tabular-nums}
.k .big b{font-weight:600;color:var(--live)}
.k .s{font-size:11px;color:var(--muted);font-weight:300}
.k.out .big b{color:var(--text)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bar input{flex:1;min-width:200px;background:var(--glass);border:1px solid var(--line);border-radius:12px;color:var(--text);font:400 14px Sora,system-ui,sans-serif;padding:12px 14px;outline:0}
.bar input:focus{border-color:rgba(43,230,186,.5)}
.count{font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:1.4fr 1.4fr 1fr .9fr .8fr;gap:12px;align-items:center;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:13px}
.row .nm{font-weight:600;font-size:13.5px}
.row .sub{color:var(--muted);font-weight:300;word-break:break-all}
.pill{display:inline-block;font-size:10.5px;letter-spacing:.06em;border-radius:999px;padding:5px 10px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.v{color:var(--live);border-color:rgba(43,230,186,.35);background:rgba(43,230,186,.06)}
.head{background:transparent;border:0;padding:4px 16px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.vazio{color:var(--muted);font-size:14px;font-weight:300;padding:28px 4px}
.copy{background:none;border:0;color:inherit;font:inherit;cursor:pointer;text-align:left;padding:0}
.copy:hover{color:var(--live)}
.foot{margin-top:34px;font-size:10px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--deep);color:var(--text);border:1px solid rgba(43,230,186,.4);border-radius:999px;padding:10px 16px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.toast.on{opacity:1}
@media (max-width:760px){
  .row{grid-template-columns:1fr auto;gap:6px 10px}
  .row .c-mail,.row .c-tel{grid-column:1 / -1}
  .row .c-conta{grid-column:1}
  .row .c-vend{grid-column:2;grid-row:1;justify-self:end}
  .row .c-cad{grid-column:2;justify-self:end}
  .head{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <header class="brand">
    <div class="word"><b>SEJA LIVRE</b><span>Investimentos</span></div>
    <div class="tag">Indicações</div>
  </header>

  <section id="login">
    <div class="kicker">Acesso restrito</div>
    <h1>Painel de <em>indicações</em></h1>
    <p class="lead" style="margin-bottom:24px">Veja quantas pessoas cada vendedor trouxe e quem já virou cliente.</p>
    <form class="card" id="f" autocomplete="off">
      <label class="l" for="senha">Senha de acesso</label>
      <input class="in" id="senha" type="password" autocomplete="current-password" required>
      <button class="btn full" id="entrar" type="submit">Entrar</button>
      <div class="erro" id="erro" role="alert"></div>
    </form>
  </section>

  <section id="painel">
    <div class="top">
      <div>
        <div class="kicker" id="parc"></div>
        <h1>Quem cada <em>vendedor</em> trouxe</h1>
        <div class="meta" id="meta"></div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn ghost" id="atualizar" type="button">Atualizar</button>
        <button class="btn ghost" id="sair" type="button">Sair</button>
      </div>
    </div>

    <div class="grid" id="cards"></div>

    <div class="bar">
      <input id="busca" type="search" placeholder="Buscar por nome, e-mail ou telefone" aria-label="Buscar">
      <span class="count" id="count"></span>
    </div>
    <div class="list" id="lista"></div>
  </section>

  <p class="foot">Seja Livre Investimentos · Praia de Botafogo 228, 9º andar · Rio de Janeiro</p>
</main>
<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';
  const SUPABASE_URL = 'https://hdgacffmwigdscrtctia.supabase.co';
  const KEY = 'sb_publishable_8-g_Xdbxmb52CnPVhOpkBw_BmJk2M1a';
  const VENDEDORES = ['PRM 1','PRM 2','PRM 3','PRM 4','PRM 5'];
  const SEM = 'Sem vendedor identificado';
  const $ = id => document.getElementById(id);
  let dados = null, filtro = null, senha = null;

  function guardar(v){ try{ v ? sessionStorage.setItem('ind_s', v) : sessionStorage.removeItem('ind_s'); }catch(e){} }
  function lido(){ try{ return sessionStorage.getItem('ind_s'); }catch(e){ return null; } }

  async function buscar(s){
    const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/indicacoes_parceiro', {
      method:'POST',
      headers:{'apikey':KEY,'Authorization':'Bearer ' + KEY,'Content-Type':'application/json'},
      body: JSON.stringify({p_token: s})
    });
    if(!r.ok) throw new Error('rede');
    return r.json();
  }

  async function entrar(s, silencioso){
    $('entrar').disabled = true; $('erro').textContent = '';
    try{
      const d = await buscar(s);
      if(!d || d.erro){ guardar(null); if(!silencioso) $('erro').textContent = 'Senha incorreta.'; mostrar(false); return; }
      senha = s; guardar(s); dados = d; mostrar(true); render();
    }catch(e){
      if(!silencioso) $('erro').textContent = 'Não foi possível conectar. Tente de novo.';
    }finally{ $('entrar').disabled = false; }
  }

  function mostrar(on){
    $('login').style.display = on ? 'none' : 'block';
    $('painel').style.display = on ? 'block' : 'none';
  }

  function fmtData(s){ if(!s) return '—'; const d = String(s).slice(0,10).split('-'); return d.length===3 ? d[2]+'/'+d[1]+'/'+d[0] : s; }
  function el(tag, cls, txt){ const e = document.createElement(tag); if(cls) e.className = cls; if(txt!=null) e.textContent = txt; return e; }

  function render(){
    $('parc').textContent = dados.parceiro || '';
    const at = dados.atualizado_em ? new Date(dados.atualizado_em) : null;
    $('meta').textContent = 'Barras SEJA LIVRE 109 (corretagem zero) e 110 (com corretagem)' + (at ? ' · atualizado ' + at.toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}) : '');

    const chamaram = {}; (dados.vendedores||[]).forEach(v => chamaram[v.vendedor] = v.chamaram);
    const clientes = {}; (dados.clientes||[]).forEach(c => clientes[c.vendedor] = (clientes[c.vendedor]||0) + 1);
    const nomes = VENDEDORES.slice();
    Object.keys(chamaram).concat(Object.keys(clientes)).forEach(n => { if(n!==SEM && nomes.indexOf(n)<0) nomes.push(n); });

    const box = $('cards'); box.textContent = '';
    nomes.forEach(n => box.appendChild(card(n, clientes[n]||0, (chamaram[n]||0) + ' chamaram no WhatsApp', false)));
    if(clientes[SEM]) box.appendChild(card(SEM, clientes[SEM], 'clientes sem etiqueta PRM', true));
    lista();
  }

  function card(nome, n, sub, out){
    const b = el('button','k' + (out?' out':''));
    b.type = 'button'; b.setAttribute('aria-pressed', filtro===nome ? 'true':'false');
    b.appendChild(el('div','n', nome === SEM ? 'Sem vendedor' : nome));
    const big = el('div','big'); const bb = el('b',null,String(n)); big.appendChild(bb);
    big.appendChild(document.createTextNode(n===1?' cliente':' clientes')); b.appendChild(big);
    b.appendChild(el('div','s',sub));
    b.addEventListener('click', () => { filtro = (filtro===nome ? null : nome); render(); });
    return b;
  }

  function lista(){
    const q = $('busca').value.trim().toLowerCase();
    const qd = q.replace(/\D/g,'');
    const rows = (dados.clientes||[]).filter(c => {
      if(filtro && c.vendedor !== filtro) return false;
      if(!q) return true;
      return (c.nome||'').toLowerCase().includes(q) || (c.email||'').toLowerCase().includes(q) ||
             (qd.length >= 3 && (c.telefone||'').replace(/\D/g,'').includes(qd));
    });
    const L = $('lista'); L.textContent = '';
    $('count').textContent = rows.length + (rows.length===1 ? ' cliente' : ' clientes') + (filtro ? ' · ' + (filtro===SEM?'sem vendedor':filtro) : '');
    if(!rows.length){ L.appendChild(el('div','vazio', filtro ? 'Nenhum cliente deste vendedor ainda.' : 'Nenhum cliente encontrado.')); return; }
    const h = el('div','row head');
    ['Cliente','E-mail','Telefone','Conta','Vendedor'].forEach(t => h.appendChild(el('div',null,t)));
    L.appendChild(h);
    rows.forEach(c => {
      const r = el('div','row');
      const a = el('div'); a.appendChild(el('div','nm',c.nome||'—')); a.appendChild(el('div','sub c-cad','Cadastro ' + fmtData(c.cadastro)));
      r.appendChild(a);
      const m = el('div','sub c-mail'); m.appendChild(copiavel(c.email)); r.appendChild(m);
      const t = el('div','sub c-tel'); t.appendChild(copiavel(c.telefone)); r.appendChild(t);
      const k = el('div','c-conta'); k.appendChild(el('span','pill', c.conta||'—')); r.appendChild(k);
      const v = el('div','c-vend'); v.appendChild(el('span','pill' + (c.vendedor!==SEM?' v':''), c.vendedor===SEM?'Sem vendedor':c.vendedor)); r.appendChild(v);
      L.appendChild(r);
    });
  }

  function copiavel(txt){
    if(!txt) return el('span',null,'—');
    const b = el('button','copy',txt); b.type='button'; b.title='Copiar';
    b.addEventListener('click', () => {
      (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('Copiado')).catch(() => {});
    });
    return b;
  }

  let tt; function toast(t){ const e=$('toast'); e.textContent=t; e.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>e.classList.remove('on'),1400); }

  $('f').addEventListener('submit', e => { e.preventDefault(); const s = $('senha').value.trim(); if(s) entrar(s, false); });
  $('busca').addEventListener('input', lista);
  $('atualizar').addEventListener('click', () => senha && entrar(senha, true).then(() => toast('Atualizado')));
  $('sair').addEventListener('click', () => { guardar(null); senha=null; dados=null; filtro=null; $('senha').value=''; mostrar(false); });

  const s = lido(); if(s) entrar(s, true);
})();
</script>
</body>
</html>
